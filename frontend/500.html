<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Crop Failure | AgriConnect Pro</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2913/2913460.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: url('https://i.pinimg.com/736x/c4/9b/46/c49b46e706cddcbd7e82afdff6a2c485.jpg') no-repeat center center/cover;
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }

        /* Storm effect */
        .storm {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            font-size: 4rem;
            opacity: 0.2;
            animation: drift 20s infinite;
        }

        .cloud:nth-child(1) { top: 20%; left: -10%; animation-delay: 0s; }
        .cloud:nth-child(2) { top: 50%; left: 30%; animation-delay: 5s; }
        .cloud:nth-child(3) { top: 10%; left: 70%; animation-delay: 10s; }
        .cloud:nth-child(4) { top: 70%; left: 50%; animation-delay: 15s; }

        @keyframes drift {
            0% { transform: translateX(-100px); }
            50% { transform: translateX(100px); }
            100% { transform: translateX(-100px); }
        }

        .error-container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            max-width: 600px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            animation: shakeIn 0.6s ease-out;
        }

        @keyframes shakeIn {
            0% { transform: translateX(-20px); opacity: 0; }
            25% { transform: translateX(20px); }
            50% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
            100% { transform: translateX(0); opacity: 1; }
        }

        .error-icon {
            font-size: 5rem;
            color: #ff6b6b;
            margin-bottom: 20px;
            animation: pulse 2s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: #ff6b6b;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            letter-spacing: 5px;
        }

        .error-title {
            font-size: 2rem;
            color: white;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .error-message {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .error-emoji {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: wobble 2s infinite;
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border-radius: 50px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Poppins', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50, #66BB6A);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .contact-link {
            color: #4caf50;
            text-decoration: none;
            margin-top: 20px;
            display: inline-block;
            font-size: 0.9rem;
        }

        .contact-link:hover {
            text-decoration: underline;
        }

        /* Loading bar */
        .loading-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin: 20px 0;
        }

        .loading-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #66BB6A);
            border-radius: 2px;
            animation: loading 3s ease infinite;
        }

        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        @media (max-width: 768px) {
            .glass-card {
                padding: 30px 20px;
            }
            .error-code {
                font-size: 4rem;
            }
            .error-title {
                font-size: 1.5rem;
            }
            .btn {
                padding: 12px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Storm Clouds -->
    <div class="storm">
        <div class="cloud">☁️</div>
        <div class="cloud">🌧️</div>
        <div class="cloud">☁️</div>
        <div class="cloud">🌩️</div>
    </div>

    <div class="error-container">
        <div class="glass-card">
            <div class="error-emoji">🌪️</div>
            <div class="error-icon">
                <i class="fas fa-server"></i>
            </div>
            <div class="error-code">500</div>
            <div class="error-title">Crop Failure</div>
            <div class="error-message">
                The server encountered a problem while processing your request.<br>
                Our agricultural engineers are working to fix this issue.
            </div>
            <div class="loading-bar">
                <div class="loading-fill"></div>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="window.location.reload()">
                    <i class="fas fa-sync-alt"></i> Try Again
                </button>
                <a href="/" class="btn btn-secondary">
                    <i class="fas fa-home"></i> Back to Home
                </a>
            </div>
            <br>
            <a href="mailto:support@agriconnect.com" class="contact-link">
                <i class="fas fa-envelope"></i> Contact Support
            </a>
        </div>
    </div>

    <script>
        // Auto-retry countdown
        let retrySeconds = 30;
        const retryBtn = document.querySelector('.btn-primary');
        
        function startRetryCountdown() {
            const countdownInterval = setInterval(() => {
                retrySeconds--;
                if (retrySeconds <= 0) {
                    clearInterval(countdownInterval);
                    window.location.reload();
                } else {
                    retryBtn.innerHTML = `<i class="fas fa-sync-alt"></i> Retry in ${retrySeconds}s`;
                }
            }, 1000);
        }
        
        // Start countdown after 3 seconds
        setTimeout(() => {
            startRetryCountdown();
        }, 3000);
        
        // Add hover effects for clouds
        document.querySelectorAll('.cloud').forEach(cloud => {
            cloud.addEventListener('click', () => {
                cloud.style.opacity = '0.5';
                setTimeout(() => {
                    cloud.style.opacity = '0.2';
                }, 200);
            });
        });
    </script>
</body>
</html>
